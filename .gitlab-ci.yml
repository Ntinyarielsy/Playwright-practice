# Use the official Microsoft Playwright Docker image so browsers and Playwright are pre-installed.
image: mcr.microsoft.com/playwright:v1.59.1-jammy

# Define the stages used by the pipeline.
stages:
  - install
  - test
  - report

variables:
  # Ensure the pipeline runs in CI mode.
  CI: "true"

# Cache node modules between pipeline runs & playwright browser dowloads and lockfiles to speed up build time.
cache:
  paths:
    - node_modules/
    - ~/.cache/ms-playwright/

# Install dependencies before running tests.
before_script:
  - npm ci

install_dependencies:
  stage: install
  script:
    - echo "Dependencies installed"

playwright_test:
  stage: test
  script:
    # Install project dependencies.
    - npm install
    # Install Playwright browsers and required dependencies inside the container.
    - npx playwright install --with-deps
    # Run all Playwright tests in the repository.
    - npx playwright test
  artifacts:
    when: always
    paths:
      # Browsable HTML report (download, unzip, open index.html).
      - playwright-report/
      # Traces, screenshots and error context for failed tests.
      - test-results/
    reports:
      # Surfaces per-test pass/fail in the pipeline/MR "Tests" tab.
      junit: results.xml
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  
report:
  stage: report
  script:
    - echo "Generate report or upload artifacts"
  needs:
    - job: playwright_test
      artifacts: true
